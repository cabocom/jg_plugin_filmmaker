# ==============================================================================
# Entorno autónomo desacoplado para pruebas de integración de jg_plugin_filmmaker
# Arnés mínimo: Execution Plane (jg_agente) y PostgreSQL de Checkpointing
# ==============================================================================
services:
  # ============================================================================
  # 1. Base de datos PostgreSQL para el Agente Cognitivo (Checkpointer / State)
  # ============================================================================
  jg_agente_postgres:
    image: postgres:16-alpine
    container_name: jg_agente_postgres_filmmaker
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${JG_AGENTE_POSTGRES_DB:-jg_agente}
      POSTGRES_USER: ${JG_AGENTE_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: "${JG_AGENTE_POSTGRES_PASSWORD:?Error: JG_AGENTE_POSTGRES_PASSWORD requerida}"
    volumes:
      - jg_agente_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${JG_AGENTE_POSTGRES_USER:-postgres} -d ${JG_AGENTE_POSTGRES_DB:-jg_agente}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - jg_network

  # ============================================================================
  # 2. Agente Cognitivo con plugin jg_plugin_filmmaker montado
  # ============================================================================
  jg_agente_filmmaker:
    image: registry.gitlab.com/javiergalvez-ia/jg_agente:latest
    container_name: jg_agente_filmmaker
    restart: unless-stopped
    depends_on:
      jg_agente_postgres:
        condition: service_healthy
    entrypoint: ["/app/docker-entrypoint.sh"]
    environment:
      ENV: ${ENV:-development}
      AGENT_ID: ${AGENT_ID:-a0000000-0000-0000-0000-000000000001}
      AGENT_NAME: "Filmmaker Agent"
      PERMANENT_AGENT_SECRET: "${JG_AGENTE_SECRET:?Error: JG_AGENTE_SECRET requerida}"
      AGENT_PORT: 8000
      AGENT_API_URL: http://jg_agente_filmmaker:8000
      POSTGRES_HOST: jg_agente_postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${JG_AGENTE_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: "${JG_AGENTE_POSTGRES_PASSWORD:?Error: JG_AGENTE_POSTGRES_PASSWORD requerida}"
      POSTGRES_DB: ${JG_AGENTE_POSTGRES_DB:-jg_agente}
      DATABASE_URL: postgresql+asyncpg://${JG_AGENTE_POSTGRES_USER:-postgres}:${JG_AGENTE_POSTGRES_PASSWORD:?Error: JG_AGENTE_POSTGRES_PASSWORD requerida}@jg_agente_postgres:5432/${JG_AGENTE_POSTGRES_DB:-jg_agente}
      VERIFY_CREDENTIALS_ON_BOOT: "false"
      ENABLE_HEARTBEAT: "false"
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}
      LLM_API_KEY: ${GLOBAL_GROQ_API_KEY:-${GROQ_API_KEY:-}}
      GROQ_API_KEY: ${GLOBAL_GROQ_API_KEY:-${GROQ_API_KEY:-}}
      PLUGINS_DIR: plugins
      ENABLED_PLUGINS: filmmaker,jg_plugin_filmmaker
    volumes:
      - ./jg_plugin_filmmaker:/app/plugins/jg_plugin_filmmaker:ro
      - ./docker/entrypoint.sh:/app/docker-entrypoint.sh:ro
    ports:
      - "127.0.0.1:${AGENT_PORT:-8881}:8000"
    networks:
      - jg_network

networks:
  jg_network:
    driver: bridge

volumes:
  jg_agente_postgres_data:
